name: money_flow_app
services:
  db:
    image: postgres:18.6
    container_name: postgres_db_container
    restart: always
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: money_flow_db
      POSTGRES_PASSWORD: 123456
      
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  
  pgAdmin:
    image: dpage/pgadmin4:9.18
    container_name: pg_admin_gui_container
    restart: always
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_PASSWORD: 123456
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin


volumes:
  postgres_data:
  pgadmin_data: